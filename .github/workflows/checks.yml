name: Kontroller

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Her pazartesi 06:00 UTC (09:00 TSİ); yerel haftalık denetim 10:00'da bu sonucu okur.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ilk_deneme_suresi:
        description: "İlk WebKit denemesinin süre sınırı (yeniden denemeyi sınamak için kısaltılır, ör. 20s)"
        default: "6m"

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # geçmiş taraması için tüm commit'ler

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Araç testleri (bekçinin kendi negatif testleri dahil)
        run: node --test "tools/**/*.test.mjs"

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip denetimi (paketler, uygulama ve testleri)
        run: npm run typecheck

      - name: Paket testleri (tema token'ları maketle birebir, kontrast eşikleri)
        run: npm run test:packages

      - name: Uygulama testleri (apps/mobile saf fonksiyonları)
        run: npm run test:apps

      - name: Edge Function testleri
        run: npm run test:functions

      # Kişisel denylist GitHub secret'ından gelir (GUARD_DENYLIST). Yoksa bu kural atlanır ve
      # çıktıda "kişisel denylist yok (atlandı)" yazar. Bekçi değerleri asla yazdırmaz.
      - name: Gizlilik taraması (tüm repo)
        env:
          HOOPLAB_GUARD_DENYLIST_TEXT: ${{ secrets.GUARD_DENYLIST }}
        run: node tools/guard/privacy-guard.mjs --all

      - name: Gizlilik taraması (tüm git geçmişi)
        env:
          HOOPLAB_GUARD_DENYLIST_TEXT: ${{ secrets.GUARD_DENYLIST }}
        run: node tools/guard/privacy-guard.mjs --history

      - name: Kaynak doğrulama (biçim, DOI/PMID, geri çekilme)
        run: node tools/research/validate-sources.mjs --online

  # Veritabanı testleri (pgTAP): RLS, yetkiler, CHECK kısıtları. Yerel Supabase'i Docker'da açar,
  # migration'ları sıfırdan uygular; bulut projesine bağlanmaz, sır kullanmaz. Yerelde: npm run test:db.
  veritabani:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bağımlılıklar (Supabase CLI kök devDependency)
        run: npm ci

      - name: Yerel Supabase (yerelle aynı servisler)
        run: npm run db:start

      - name: pgTAP testleri
        run: npm run test:db

  # Uçtan uca testler: uygulamanın web çıktısı, WebKit (iPhone boyutu), demo modu; sunucu ve sır yok.
  # iOS'a özgü sorunları yakalamaz (klavye, native bileşen); onlar cihazda bakılır. Ayrıntı: e2e/playwright.config.ts.
  uctan-uca:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # WebKit kurulumunun iki denemesi (2 × 6 dk) + kurulum ve testler
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bağımlılıklar
        run: npm ci

      # apt aynası zaman zaman çok yavaşlıyor (2026-10-22: 15 dk'da bitmedi, iş iptal oldu; normali <1 dk).
      # Deneme başına 6 dk sınır, bir yeniden deneme; inen paketler apt önbelleğinde kalır, ikinci deneme oradan sürer.
      # timeout yalnız npx'i durdurur, sudo altındaki apt-get dpkg kilidini tutarak sürer (2026-10-26: ikinci deneme
      # "Could not get lock" ile anında düştü). Bu yüzden denemeler arasında apt-get durdurulur, yarım kurulum
      # toparlanır ve apt kilidi en çok 2 dk bekler.
      - name: WebKit
        env:
          ILK_SURE: ${{ inputs.ilk_deneme_suresi }}
        run: |
          [[ "$ILK_SURE" =~ ^[0-9]+[sm]$ ]] || ILK_SURE=6m
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/90kilit-bekle > /dev/null
          for deneme in 1 2; do
            sure=6m; [ "$deneme" = 1 ] && sure="$ILK_SURE"
            timeout "$sure" npx playwright install --with-deps webkit && exit 0
            echo "::warning::WebKit kurulumu ${deneme}. denemede bitmedi"
            pgrep -a apt-get || echo "kalan apt-get yok"
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Uçtan uca testler (web çıktısı, WebKit, demo)
        run: npm run e2e

      - name: Rapor (yalnız hata olursa)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uctan-uca-raporu
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 7

name: Portfolyo sayfası

# Tanıtım sayfası ve uygulamanın yalnız demo web derlemesi (karar 0050): https://hooplab.dev/ (alan adı, karar 0053)
# Demo Supabase değerleri boş derlenir; sır kullanılmaz, sunucuya bağlanılmaz. Gizlilik politikası ve Google'ın
# geri dönüş sayfası (/oauth/google/) da burada; geri dönüşün hedefi repo değişkeni GHEALTH_CALLBACK_URL'den.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/site/**"
      - "apps/mobile/**"
      - "packages/**"
      - "research/**"
      - "docs/decisions/**"
      - "docs/sessions/**"
      - "docs/gorseller/**"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bağımlılıklar
        run: npm ci

      - name: Sayfa ve demo
        env:
          GHEALTH_CALLBACK_URL: ${{ vars.GHEALTH_CALLBACK_URL }}
        run: node tools/site/build-site.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.dist
          include-hidden-files: true

  yayinla:
    needs: derle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
